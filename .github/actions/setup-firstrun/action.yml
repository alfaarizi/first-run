name: setup firstrun
description: Installs the toolchains and dependencies a make target needs

inputs:
  target:
    description: The make target to install for, empty installs everything
    default: ''
  skip-toolchains:
    description: Skips the toolchain installs when the job image already carries them
    default: 'false'

# The component in the target name picks the toolchain and the npm tree.
runs:
  using: composite
  steps:
    - name: setup node
      uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
      if: ${{ !contains(inputs.target, 'server') && !contains(inputs.target, 'agent') && inputs.skip-toolchains != 'true' }}
      with:
        node-version: 22
    # node22 mirrors node-version, the Node ABI native modules build against.
    - name: restore node_modules
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      id: node-modules
      if: ${{ !contains(inputs.target, 'server') && !contains(inputs.target, 'agent') && !endsWith(inputs.target, '-web') && !contains(inputs.target, 'widget') && inputs.target != 'size' }}
      with:
        path: node_modules
        key: node-modules-${{ runner.os }}-${{ runner.arch }}-node22-${{ hashFiles('package-lock.json') }}
    - name: install dependencies
      if: ${{ steps.node-modules.outcome == 'success' && steps.node-modules.outputs.cache-hit != 'true' }}
      run: npm ci --no-audit --no-fund
      shell: bash
    - name: restore widget node_modules
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      id: widget-node-modules
      if: ${{ inputs.target == '' || contains(inputs.target, 'widget') || inputs.target == 'size' }}
      with:
        path: widget/node_modules
        key: widget-node-modules-${{ runner.os }}-${{ runner.arch }}-node22-${{ hashFiles('widget/package-lock.json') }}
    - name: install widget dependencies
      if: ${{ steps.widget-node-modules.outcome == 'success' && steps.widget-node-modules.outputs.cache-hit != 'true' }}
      working-directory: widget
      run: npm ci --no-audit --no-fund
      shell: bash
    - name: restore web node_modules
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      id: web-node-modules
      if: ${{ inputs.target == '' || endsWith(inputs.target, '-web') }}
      with:
        path: web/node_modules
        key: web-node-modules-${{ runner.os }}-${{ runner.arch }}-node22-${{ hashFiles('web/package-lock.json') }}
    - name: install web dependencies
      if: ${{ steps.web-node-modules.outcome == 'success' && steps.web-node-modules.outputs.cache-hit != 'true' }}
      working-directory: web
      run: npm ci --no-audit --no-fund
      shell: bash
    - name: setup java
      uses: actions/setup-java@1bcf9fb12cf4aa7d266a90ae39939e61372fe520 # v5.4.0
      if: ${{ (inputs.target == '' || contains(inputs.target, 'server')) && inputs.skip-toolchains != 'true' }}
      with:
        distribution: temurin
        java-version: 21
        cache: maven
    - name: setup uv
      uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
      if: ${{ (inputs.target == '' || contains(inputs.target, 'agent')) && inputs.skip-toolchains != 'true' }}
      with:
        version: "0.11.26"
        enable-cache: true
        cache-dependency-glob: agent/uv.lock
