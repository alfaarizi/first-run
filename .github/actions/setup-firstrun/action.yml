name: setup firstrun
description: Installs the toolchains and dependencies a make target needs

inputs:
  target:
    description: The make target to install for, empty installs everything
    default: ''
  skip-toolchains:
    description: Skips the toolchain installs when the job image already carries them
    default: 'false'

# The component in the target name picks the toolchain and the npm tree.
runs:
  using: composite
  steps:
    - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
      if: ${{ !contains(inputs.target, 'server') && !contains(inputs.target, 'agent') && inputs.skip-toolchains != 'true' }}
      with:
        node-version: 22
        cache: npm
        cache-dependency-path: '**/package-lock.json'
    - uses: actions/setup-java@1bcf9fb12cf4aa7d266a90ae39939e61372fe520 # v5.4.0
      if: ${{ (inputs.target == '' || contains(inputs.target, 'server')) && inputs.skip-toolchains != 'true' }}
      with:
        distribution: temurin
        java-version: 21
        cache: maven
    - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
      if: ${{ (inputs.target == '' || contains(inputs.target, 'agent')) && inputs.skip-toolchains != 'true' }}
      with:
        version: "0.11.26"
        enable-cache: true
        cache-dependency-glob: agent/uv.lock
    - run: npm ci --no-audit --no-fund
      if: ${{ !contains(inputs.target, 'server') && !contains(inputs.target, 'agent') && !endsWith(inputs.target, '-web') }}
      shell: bash
    - name: install web dependencies
      if: ${{ inputs.target == '' || endsWith(inputs.target, '-web') }}
      working-directory: web
      run: npm ci --no-audit --no-fund
      shell: bash
