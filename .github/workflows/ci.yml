name: CI

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Path filters sit on jobs because a workflow skipped by on.paths leaves its
  # required check pending, and a skipped job reports success.
  changes:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      evals: ${{ steps.filter.outputs.evals }}
      widget: ${{ steps.filter.outputs.widget }}
    steps:
      - uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4.0.2
        id: filter
        with:
          filters: |
            evals:
              - 'agent/**'
              - 'api/**'
              - 'evals/**'
              # make eval runs the harness from outside evals/.
              - 'Makefile'
              - 'scripts/lib/**'
              - 'scripts/verify-datasets.mjs'
            widget:
              - 'widget/**'

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-firstrun
      - run: make lint

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-firstrun
      - run: make test

  # Static API lint runs in make lint, never in this job.
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-firstrun
      # Compares against the base commit GitHub recorded when the run started,
      # the same default bufbuild/buf-action computes.
      - name: buf breaking against the base branch
        working-directory: api
        env:
          BASE_BRANCH_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if git cat-file -e "${BASE_BRANCH_SHA}:api/buf.yaml" 2>/dev/null; then
            npx --no-install buf breaking --against "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git#format=git,commit=${BASE_BRANCH_SHA},subdir=api"
          else
            echo "::notice::api/buf.yaml is not on the base branch yet, nothing to break against"
          fi
      - name: graphql-inspector diff against the base branch
        env:
          BASE_BRANCH_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if git cat-file -e "${BASE_BRANCH_SHA}:api/graphql" 2>/dev/null; then
            git worktree add "$RUNNER_TEMP/base" "$BASE_BRANCH_SHA"
            npx --no-install graphql-inspector diff \
              "$RUNNER_TEMP/base/api/graphql/*.graphqls" \
              "api/graphql/*.graphqls"
          else
            echo "::notice::api/graphql is not on the base branch yet, nothing to diff against"
          fi
      - name: regenerate stubs
        run: |
          make generate
          git diff --exit-code

  eval:
    needs: changes
    if: needs.changes.outputs.evals == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - run: make eval

  size:
    needs: changes
    if: needs.changes.outputs.widget == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - run: make size
