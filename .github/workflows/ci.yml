name: CI

on:
  pull_request:
  merge_group:

permissions:
  contents: read
  packages: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # on.paths would leave required checks pending, and an unspawned leg
  # reports no status, so branch protection requires only the check job.
  determine-changes:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      targets: ${{ steps.filter.outputs.changes || steps.all.outputs.changes }}
    steps:
      # Filter names are make targets, and each match spawns one make leg.
      - uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4.0.2
        if: github.event_name == 'pull_request'
        id: filter
        with:
          filters: |
            lint-api:
              # The recipes and the CI definition are inputs to every leg.
              - &ci
                - 'Makefile'
                - '.github/workflows/ci.yml'
                - '.github/actions/setup-firstrun/**'
              - 'api/**'
              - 'package-lock.json'
            lint-server: &server
              - *ci
              - 'server/**'
            lint-agent: &agent
              - *ci
              - 'agent/**'
            lint-web: &web
              - *ci
              - 'web/**'
            # test-server and test-web regenerate from api/graphql first.
            test-server:
              - *server
              - 'api/graphql/**'
            test-server-unit: *server
            test-agent: *agent
            test-web:
              - *web
              - 'api/graphql/**'
            test-widget: &widget
              - *ci
              - 'widget/**'
            eval:
              - *agent
              - 'api/**'
              - 'evals/**'
              # make eval runs the harness from outside evals/.
              - 'scripts/lib/**'
              - 'scripts/verify-datasets.mjs'
            size: *widget
      # A queued result is what lands on main, so it runs every target. The
      # list mirrors the filter names, minus the unit slice test-server covers.
      - id: all
        if: github.event_name == 'merge_group'
        run: echo 'changes=["lint-api","lint-server","lint-agent","lint-web","test-server","test-agent","test-web","test-widget","eval","size"]' >> "$GITHUB_OUTPUT"

  make:
    name: ${{ matrix.target }}
    needs: determine-changes
    if: needs.determine-changes.outputs.targets != '[]'
    runs-on: ubuntu-latest
    # CI_IMAGE is a digest-pinned image ref, unset until the first publish.
    # test-server stays on the runner because Testcontainers needs its Docker.
    container:
      image: ${{ matrix.target != 'test-server' && vars.CI_IMAGE || '' }} # zizmor: ignore[unpinned-images]
      # GHCR packages are private by default, so pulls authenticate with the job token.
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.determine-changes.outputs.targets) }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-firstrun
        with:
          target: ${{ matrix.target }}
          skip-toolchains: ${{ job.container.id != '' }}
      # The build cache extension validates the restore per input checksum, so
      # a server leg whose inputs are unchanged skips its build and tests.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: startsWith(matrix.target, 'test-server')
        env:
          # The &ci files steer the Maven run but sit outside the extension's checksum.
          CI_INPUTS: ${{ hashFiles('Makefile', '.github/workflows/ci.yml', '.github/actions/setup-firstrun/**') }}
        with:
          path: ~/.m2/build-cache
          # Keys are per target so the unit leg never serves the full leg a
          # cache entry whose surefire filters excluded the integration tests.
          key: maven-build-cache-${{ matrix.target }}-${{ env.CI_INPUTS }}-${{ github.sha }}
          restore-keys: maven-build-cache-${{ matrix.target }}-${{ env.CI_INPUTS }}-
      - name: make ${{ matrix.target }}
        env:
          TARGET: ${{ matrix.target }}
        # The location is pinned because java resolves user.home from passwd,
        # which diverges from the HOME the cache step sees in container jobs.
        run: >-
          MAVEN_ARGS="-Dmaven.build.cache.enabled=true
          -Dmaven.build.cache.location=$HOME/.m2/build-cache" make "$TARGET"

  # Runs on every PR, because a filter would have to track every generator input.
  contracts:
    runs-on: ubuntu-latest
    container:
      image: ${{ vars.CI_IMAGE }} # zizmor: ignore[unpinned-images]
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    env:
      # The base commit GitHub recorded when the run started, buf-action's default.
      BASE_BRANCH_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      # Depth 1 plus a targeted fetch stays O(1) as the history grows.
      - name: fetch the base commit
        run: git fetch --depth=1 origin "$BASE_BRANCH_SHA"
      - uses: ./.github/actions/setup-firstrun
        with:
          skip-toolchains: ${{ job.container.id != '' }}
      - name: buf breaking against the base branch
        working-directory: api
        run: |
          if git cat-file -e "${BASE_BRANCH_SHA}:api/buf.yaml" 2>/dev/null; then
            npx --no-install buf breaking --against "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git#format=git,commit=${BASE_BRANCH_SHA},subdir=api"
          else
            echo "::notice::api/buf.yaml is not on the base branch yet, nothing to break against"
          fi
      - name: graphql-inspector diff against the base branch
        run: |
          if git cat-file -e "${BASE_BRANCH_SHA}:api/graphql" 2>/dev/null; then
            git worktree add "$RUNNER_TEMP/base" "$BASE_BRANCH_SHA"
            npx --no-install graphql-inspector diff \
              "$RUNNER_TEMP/base/api/graphql/*.graphqls" \
              "api/graphql/*.graphqls"
          else
            echo "::notice::api/graphql is not on the base branch yet, nothing to diff against"
          fi
      - name: regenerate stubs
        run: |
          make -j3 --output-sync generate
          git diff --exit-code

  # The one status branch protection requires. A skipped need means the PR
  # left that component untouched, so only failure and cancellation block.
  check:
    name: all required checks pass
    needs: [determine-changes, make, contracts]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: fail when a needed job failed or was cancelled
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
