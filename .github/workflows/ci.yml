name: CI

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: buf lint and format
        working-directory: api
        run: |
          npx --no-install buf lint
          npx --no-install buf format --diff --exit-code
      # Compares against the pull request's base branch, the branch the PR
      # merges into, at the commit GitHub recorded when the run started.
      # bufbuild/buf-action computes the same default.
      - name: buf breaking against the base branch
        working-directory: api
        env:
          BASE_BRANCH_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if git cat-file -e "${BASE_BRANCH_SHA}:api/buf.yaml" 2>/dev/null; then
            npx --no-install buf breaking --against "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git#format=git,commit=${BASE_BRANCH_SHA},subdir=api"
          else
            echo "api/buf.yaml is not on the base branch yet, nothing to break against"
          fi
      - name: graphql-inspector diff against the base branch
        env:
          BASE_BRANCH_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if git cat-file -e "${BASE_BRANCH_SHA}:api/graphql" 2>/dev/null; then
            git worktree add "$RUNNER_TEMP/base" "$BASE_BRANCH_SHA"
            npx --no-install graphql-inspector diff \
              "$RUNNER_TEMP/base/api/graphql/*.graphqls" \
              "api/graphql/*.graphqls"
          else
            echo "api/graphql is not on the base branch yet, nothing to diff against"
          fi
      - name: spectral lint
        run: npx --no-install spectral lint --ruleset api/.spectral.yaml --fail-severity warn "api/openapi/*.yaml"
      - name: regenerate stubs
        run: make generate
