name: Claude Review

on:
  issue_comment:
    types: [created]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  claude-review:
    if: github.event.issue.pull_request && contains(github.event.comment.body, '/claude review')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write # Post the PR review
      issues: read
      id-token: write # Mint the Claude GitHub App token
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - name: Claude Review
        uses: anthropics/claude-code-action@558b1d6cab4085c7753fe402c10bef0fbb92ac7a # v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: https://github.com/anthropics/claude-code.git
          plugins: code-review@claude-code-plugins
          prompt: |
            /code-review:code-review ${{ github.repository }}/pull/${{ github.event.issue.number }} --comment

            Review even if Claude has already commented on this PR. A
            `/claude review` comment always asks for a fresh review.

            Post all findings as one pending review through the GitHub MCP
            tools: create it, add each inline comment, then submit. Never
            post through `gh api`, because the shell security checks reject
            its JSON payloads. Use `gh pr comment` only for no-issues summary.
          # List every tool the plugin touches. A missing tool costs a denied
          # call and a turn. MCP names match the github-mcp-server v0.17.1
          # image the pinned action ships. The order follows the pipeline:
          # orchestrate, read, post. Bash entries are read-only except
          # `gh pr comment`, which posts the no-issues summary. delete_pending
          # clears the draft review a cancelled run leaves behind.
          claude_args: >-
            --model claude-opus-4-6
            --allowedTools
            Task TodoWrite
            Read Glob Grep
            "Bash(gh pr view:*)" "Bash(gh pr diff:*)" "Bash(gh pr list:*)"
            "Bash(gh issue view:*)" "Bash(gh issue list:*)" "Bash(gh search:*)"
            "Bash(git diff:*)" "Bash(git log:*)" "Bash(git show:*)"
            "Bash(git blame:*)" "Bash(git rev-parse:*)"
            "Bash(cat:*)" "Bash(head:*)" "Bash(tail:*)" "Bash(ls:*)"
            "Bash(wc:*)" "Bash(grep:*)" "Bash(jq:*)"
            "Bash(gh pr comment:*)"
            mcp__github__create_pending_pull_request_review
            mcp__github__add_comment_to_pending_review
            mcp__github__submit_pending_pull_request_review
            mcp__github__delete_pending_pull_request_review
            mcp__github_inline_comment__create_inline_comment
          display_report: true

