[project]
name = "agent"
version = "0.1.0"
description = "FirstRun policy, RAG, conversation, and memory service."
requires-python = ">=3.12,<3.13"
dependencies = [
    "asyncpg>=0.30",
    "beautifulsoup4>=4.13",
    "fastapi>=0.115",
    # Floors set by the generated stubs, which reject older runtimes at import.
    "grpcio>=1.81.1",
    "httpx>=0.28",
    "pgvector>=0.4",
    "protego>=0.3",
    "protobuf>=6.33.5",
    "pydantic-settings>=2.7",
    "uuid6>=2024.7.10",
    "uvicorn[standard]>=0.34",
    "voyageai>=0.3",
]

[dependency-groups]
dev = [
    "grpcio-tools>=1.76",
    "mypy>=1.14",
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "ruff>=0.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent"]

[tool.uv]
required-version = ">=0.9"
# Never resolve a version published in the last 7 days, uv's dependency
# cooldown (docs.astral.sh/uv/concepts/resolution/#dependency-cooldowns).
exclude-newer = "7 days"

[tool.ruff]
line-length = 88
# src/firstrun is generated output (make generate), never edited or linted.
extend-exclude = ["src/firstrun"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
# src/firstrun is generated by `make generate` and never edited. mypy checks
# only what humans write.
exclude = ['\.venv', 'src/firstrun']

[[tool.mypy.overrides]]
# Generated stubs, grpcio, and asyncpg ship no py.typed marker.
module = ["asyncpg", "asyncpg.*", "firstrun.*", "grpc", "grpc.*", "voyageai", "voyageai.*"]
follow_imports = "skip"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
