[project]
name = "agent"
version = "0.1.0"
description = "FirstRun policy, RAG, conversation, and memory service."
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "pydantic-settings>=2.7",
    "uvicorn[standard]>=0.34",
]

[dependency-groups]
dev = [
    "grpcio-tools>=1.76",
    "httpx>=0.28",
    "mypy>=1.14",
    "pytest>=8.3",
    "ruff>=0.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent"]

[tool.uv]
required-version = ">=0.9"
# Never resolve a version published in the last 7 days, uv's dependency
# cooldown (docs.astral.sh/uv/concepts/resolution/#dependency-cooldowns).
exclude-newer = "7 days"

[tool.ruff]
line-length = 88
# src/firstrun is generated output (make generate), never edited or linted.
extend-exclude = ["src/firstrun"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
# src/firstrun is generated by `make generate` and never edited. mypy checks
# only what humans write.
exclude = ['\.venv', 'src/firstrun']

[tool.pytest.ini_options]
testpaths = ["tests"]
