openapi: 3.1.0
info:
  title: FirstRun Ingest API
  version: 1.0.0
  description: |
    Accepts event batches from the widget SDK. The gateway authenticates the
    request signature, checks the `Origin` header against the app's allowed
    origins, deduplicates on each event's `id`, drops properties not on the
    app's allowlist, and truncates the client IP before storage.

    Breaking changes ship as a new path. `/v1/e` never changes shape because
    customer snippets update slowly.
  contact:
    name: FirstRun
    url: https://github.com/alfaarizi/first-run
  license:
    name: AGPL-3.0-only
    identifier: AGPL-3.0-only
servers:
  - url: /
    description: The gateway serves this API at the deployment root.
tags:
  - name: ingest
    description: Ingests events from the widget SDK.
paths:
  /v1/e:
    post:
      operationId: ingestEvents
      tags: [ingest]
      summary: Ingest a batch of events
      description: |
        Accepts 1 to 50 events per request. The widget batches on an interval
        and flushes with a keepalive fetch on page hide. Delivery is
        at-least-once, so the gateway deduplicates on each event's `id` for
        24 hours.
      security:
        - hmacSignature: []
      parameters:
        - name: X-FirstRun-Key
          in: header
          required: true
          description: The app's SDK public key. An identifier, not a secret.
          schema:
            type: string
            maxLength: 64
        - name: X-FirstRun-Timestamp
          in: header
          required: true
          description: >
            Client time in RFC 3339 UTC. The gateway rejects requests outside
            a 5-minute window.
          schema:
            type: string
            format: date-time
        - name: X-FirstRun-Signature
          in: header
          required: true
          description: >
            Hex-encoded HMAC-SHA256 over `{timestamp}.{raw body}` with the
            app's HMAC key.
          schema:
            type: string
            pattern: ^[0-9a-f]{64}$
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventBatch'
            example:
              sent_at: '2026-07-02T12:00:03Z'
              events:
                - id: 019813f2-7f4a-7bbb-9c39-1a2b3c4d5e6f
                  event: project_created
                  end_user_hash: 9f86d081884c7d65
                  session_id: 019813f2-0000-7000-8000-000000000000
                  timestamp: '2026-07-02T12:00:01Z'
                  properties:
                    plan: pro
      responses:
        '202':
          description: Batch accepted for the event stream.
        '400':
          description: Malformed body or an event failed schema validation.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: >
            Unknown SDK key, missing or invalid signature, or timestamp
            outside the window.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: Origin not on the app's allowed origins.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '413':
          description: More than 50 events or a body over 64 KB.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          description: Rate limit exceeded for the tenant.
          headers:
            Retry-After:
              description: Seconds to wait before retrying.
              schema:
                type: integer
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
components:
  securitySchemes:
    hmacSignature:
      type: apiKey
      in: header
      name: X-FirstRun-Signature
      description: HMAC-SHA256 request signing. See the header parameters on each operation.
  schemas:
    EventBatch:
      type: object
      required: [events]
      properties:
        sent_at:
          type: string
          format: date-time
          description: Client clock at flush. The gateway uses it to correct clock skew.
        events:
          type: array
          minItems: 1
          maxItems: 50
          items:
            $ref: '#/components/schemas/Event'
    Event:
      type: object
      required: [id, event, end_user_hash, timestamp]
      properties:
        id:
          type: string
          format: uuid
          description: >
            Client-generated UUIDv7. The gateway drops events that repeat an
            `id` within 24 hours.
        event:
          type: string
          maxLength: 64
          pattern: ^(fr\.[a-z][a-z0-9_]*|[a-z][a-z0-9_]*)$
          description: >
            The event name in snake_case, object first, past-tense verb, such
            as `project_created`. The `fr.` prefix marks auto-captured
            events, so the gateway rejects it on custom ones.
        end_user_hash:
          type: string
          maxLength: 128
          description: The customer-supplied hash of their user ID. Never personal data.
        session_id:
          type: string
          format: uuid
          description: Widget-generated session ID. The widget rotates it after 30 idle minutes.
        timestamp:
          type: string
          format: date-time
          description: When the event happened, in RFC 3339 UTC.
        properties:
          type: object
          maxProperties: 20
          additionalProperties:
            type: [string, number, boolean]
          description: >
            Scalar values only. The gateway drops properties not on the app's
            allowlist.
    Problem:
      type: object
      description: An RFC 9457 problem details object.
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
