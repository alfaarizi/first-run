syntax = "proto3";

package firstrun.v1;

option java_multiple_files = true;
option java_outer_classname = "KnowledgeProto";
option java_package = "com.firstrunhq.v1";

// Indexes tenant docs for retrieval at answer time.
service KnowledgeService {
  // Starts a crawl of one doc source. Returns immediately, thus chunks become
  // searchable as the crawl proceeds.
  rpc Reindex(ReindexRequest) returns (ReindexResponse);
}

message ReindexRequest {
  string tenant_id = 1;
  string app_id = 2;
  string source_id = 3;

  // The public root URL to crawl.
  string source_url = 4;
}

message ReindexResponse {
  string source_id = 1;
  ReindexStatus status = 2;
}

enum ReindexStatus {
  REINDEX_STATUS_UNSPECIFIED = 0;
  REINDEX_STATUS_ACCEPTED = 1;
  REINDEX_STATUS_ALREADY_RUNNING = 2;
}
