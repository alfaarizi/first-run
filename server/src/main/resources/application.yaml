spring:
  application:
    name: firstrun-server
  datasource:
    url: jdbc:postgresql://localhost:5432/firstrun
    username: ${POSTGRES_APP_USER}
    password: ${POSTGRES_APP_PASSWORD}
  data:
    redis:
      host: localhost
      port: 6379
      password: ${REDIS_PASSWORD}
  kafka:
    bootstrap-servers: localhost:19092
    consumer:
      # New groups start at the earliest offset, so events produced before a
      # consumer's first deployment still reach it (the default skips them).
      auto-offset-reset: earliest
    producer:
      # Bound the produce path so a broker outage becomes a fast 503 for the
      # retrying client instead of a request hung on the default 60s block.
      properties:
        "[max.block.ms]": 2000
        "[request.timeout.ms]": 3000
        "[delivery.timeout.ms]": 5000
  mvc:
    problemdetails:
      enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health

firstrun:
  ingest:
    # Per-tenant token bucket counted in events. Capacity bounds the burst and
    # refill the sustained rate, per instance, so scale-out multiplies both.
    rate-capacity: 1000
    rate-refill-per-second: 500
    produce-timeout: 5s
  gate:
    # Stuck-signal thresholds for the in-stream gate. Raising dwell trades
    # detection speed for candidate volume.
    errors-threshold: 3
    dwell-threshold: 10m
    backtracks-threshold: 3
