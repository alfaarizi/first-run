# Throwaway datastore credentials so property binding succeeds under test. The
# Testcontainers @ServiceConnection beans supply the real connection, so these
# values are never used to connect. They only satisfy the placeholders that the
# main application.yaml leaves without defaults.
spring.datasource.username=test
spring.datasource.password=test
spring.data.redis.password=test

# Starts the container beans in parallel, so their image pulls and boots overlap.
spring.testcontainers.beans.startup=parallel
