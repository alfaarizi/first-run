<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tasklet</title>
  </head>
  <body>
    <main>
      <h1>Tasklet</h1>
      <p>A deliberately boring task app, hosting FirstRun for the demo.</p>
      <form id="task-form">
        <label for="task-name">New task</label>
        <input id="task-name" name="task-name" autocomplete="off" />
        <button type="submit">Add task</button>
      </form>
      <ul id="tasks"></ul>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
