<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tasklet</title>
    <!-- The FirstRun snippet, the one-script install this demo proves. Keys come
         from the root .env, and the same-origin host routes /v1 through the proxy. -->
    <script
      src="/firstrun.js"
      data-key="%VITE_FIRSTRUN_KEY%"
      data-secret="%VITE_FIRSTRUN_HMAC_KEY%"
      data-host="http://localhost:5174"
      data-allowlist="task_count,path"
    ></script>
  </head>
  <body>
    <main>
      <h1>Tasklet</h1>
      <p>A deliberately boring task app, hosting FirstRun for the demo.</p>
      <form id="task-form">
        <label for="task-name">New task</label>
        <input id="task-name" name="task-name" autocomplete="off" />
        <button type="submit">Add task</button>
      </form>
      <ul id="tasks"></ul>
      <button type="button" id="clear-completed">Clear completed</button>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
